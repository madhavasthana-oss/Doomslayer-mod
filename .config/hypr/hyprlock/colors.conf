# Doomshell lock palette — fire / ember on void
# Mirrors quickshell/doomshell Theme + Doomshell.colors

$accent        = rgba(255, 69, 0, 1.0)       # #FF4500
$accentWarm    = rgba(255, 202, 128, 1.0)     # #FFCA80
$accentSoft    = rgba(255, 128, 191, 1.0)     # #FF80BF
$textPrimary   = rgba(255, 69, 0, 1.0)
$textSecondary = rgba(255, 202, 128, 1.0)
$textMuted     = rgba(204, 34, 0, 1.0)        # #CC2200
$textDim       = rgba(96, 16, 0, 1.0)         # #601000
$bgPrimary     = rgba(13, 0, 0, 1.0)          # #0D0000
$bgSurface     = rgba(26, 0, 0, 0.78)         # frosted console
$bgElevated    = rgba(42, 5, 0, 0.88)
$bgIsland      = rgba(31, 2, 0, 0.82)         # #1F0200 toolbar fill
$borderIdle    = rgba(204, 34, 0, 0.55)
$borderActive  = rgba(255, 69, 0, 0.90)
$stateSafe     = rgba(138, 255, 128, 1.0)
$stateCritical = rgba(204, 34, 0, 1.0)

# Input (end-4 style soft field, doomshell ink)
$entry_background_color = rgba(13, 0, 0, 0.55)
$entry_border_color     = rgba(255, 69, 0, 0.75)
$entry_border_check     = rgba(255, 202, 128, 1.0) rgba(255, 69, 0, 1.0) 90deg
$entry_border_fail      = rgba(204, 34, 0, 1.0) rgba(255, 69, 0, 1.0) 40deg
$entry_color            = rgba(255, 202, 128, 1.0)
$caps_color             = rgba(255, 202, 128, 1.0) rgba(204, 34, 0, 1.0) 120deg

# Legacy aliases used by older widgets
$text_color = $textSecondary

$font_family       = Fira Code
$font_family_clock = KogniGear
$font_display      = KogniGear
