# ---
# Doomslayer-mod fuzzel config
# Deploy: scripts/bash/configure_fuzzel.sh  -->  ~/.config/fuzzel/
# Colors mirror quickshell Theme.qml + former rofi doomslayer.rasi
# bgPrimary #0D0000 | bgSurface #1A0000 | bgElevated #2A0500
# accent #FF4500 | accentWarm #FFCA80 | borderIdle #CC2200
# bgConsole #1F0200 @ ~0.95 opacity
# ---

font=Fira Code:size=12,Noto Color Emoji:size=12
dpi-aware=auto
use-bold=yes
prompt="APPS "
placeholder=rip and tear...
icon-theme=breeze-dark
icons-enabled=yes
fields=filename,name,generic,keywords,categories
match-mode=fzf
sort-result=yes
match-counter=no
terminal=ghostty -e
list-executables-in-path=no
show-actions=no
filter-desktop=no

anchor=center
lines=10
width=42
tabs=4
horizontal-pad=20
vertical-pad=12
inner-pad=10
line-height=28
letter-spacing=0
image-size-ratio=0.5

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# bgConsole #1F0200 @ ~95%
background=1f0200f2
# textSecondary #FFCA80
text=ffca80ff
message=ffca80ff
# accent #FF4500
prompt=ff4500ff
# textDim #601000
placeholder=601000ff
# textSecondary
input=ffca80ff
# accent match highlight
match=ff4500ff
# bgElevated #2A0500 selection bg
selection=2a0500ff
# accent selected text
selection-text=ff4500ff
selection-match=ffca80ff
# textMuted / borderIdle #CC2200
counter=cc2200ff
border=cc2200ff

[border]
width=2
radius=10
selection-radius=5

[dmenu]
mode=text
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter
execute-or-next=Tab
prev=Up Control+p
next=Down Control+n
clipboard-paste=Control+v XF86Paste
